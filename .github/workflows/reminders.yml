name: 節點前一天提醒信

on:
  schedule:
    # 台北時間每天 08:50（UTC 00:50）；GitHub 排程常會晚幾分鐘，實際約 9 點前後寄達
    - cron: '50 0 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: '立即寄一封測試信'
        type: boolean
        default: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/send-reminders.mjs
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
          TEST_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.test && 'true' || '' }}
